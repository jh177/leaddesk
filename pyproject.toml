[project]
name = "leaddesk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jh177", email = "jameshong177@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3.0",
    "fastapi>=0.141.1",
    "openai>=3.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
leaddesk = "leaddesk:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
